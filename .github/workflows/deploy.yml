name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Create deployment package
        run: |
          tar -czf my-app-prod-deploy.tar.gz \
            --exclude=server/node_modules \
            --exclude=server/uploads \
            --exclude=server/.env \
            --exclude=deploy/artifacts \
            --exclude=deploy/nginx/certs \
            deploy dist server

      - name: Upload package to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "my-app-prod-deploy.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            # 备份生产配置和数据
            cp /opt/my-app/deploy/env/prod.env /tmp/my-app-prod.env.bak
            cp -a /opt/my-app/deploy/nginx/certs /tmp/my-app-certs.bak
            cp -a /opt/my-app/server/uploads /tmp/my-app-uploads.bak

            # 解压部署包（先清理旧 dist 避免残留旧 hash 文件）
            rm -rf /opt/my-app/dist/assets
            tar -xzf /tmp/my-app-prod-deploy.tar.gz -C /opt/my-app

            # 恢复生产配置和数据
            cp /tmp/my-app-prod.env.bak /opt/my-app/deploy/env/prod.env
            rm -rf /opt/my-app/deploy/nginx/certs && cp -a /tmp/my-app-certs.bak /opt/my-app/deploy/nginx/certs
            rm -rf /opt/my-app/server/uploads && cp -a /tmp/my-app-uploads.bak /opt/my-app/server/uploads

            # 重建容器
            cd /opt/my-app
            docker compose --env-file deploy/env/prod.env -f deploy/compose/docker-compose.prod.yml up -d --build

            # 清理临时文件
            rm -f /tmp/my-app-prod-deploy.tar.gz
            rm -rf /tmp/my-app-deploy-package.tar.gz
            rm -f /tmp/my-app-prod.env.bak
            rm -rf /tmp/my-app-certs.bak
            rm -rf /tmp/my-app-uploads.bak

            # 检查状态
            docker compose --env-file deploy/env/prod.env -f deploy/compose/docker-compose.prod.yml ps
            echo "Deploy finished"
