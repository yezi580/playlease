map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream xysh_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name xysh88.com www.xysh88.com admin.xysh88.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.xysh88.com;

    ssl_certificate /etc/letsencrypt/live/xysh88.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xysh88.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://xysh88.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xysh88.com;

    ssl_certificate /etc/letsencrypt/live/xysh88.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xysh88.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass http://xysh_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.xysh88.com;

    ssl_certificate /etc/letsencrypt/live/xysh88.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xysh88.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass http://xysh_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
