# ===== 传输压缩：JS/CSS/JSON/SVG 等文本资源 gzip 压缩（woff2/图片本身已压缩，无需处理） =====
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

server {
    listen 80;
    server_name xysh88.com www.xysh88.com;
    resolver 127.0.0.11 ipv6=off;
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    location /api {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== 静态资源真 404：带文件扩展名但文件不存在的请求直接 404，不走 SPA 回退 =====
    # soft-404（200 + index.html）会污染搜索引擎收录；显式排除代理路径
    # （本地 conf 的 /api 前缀不带斜杠，排除 /api 即同时覆盖 /api/）
    location ~* ^(?!/api|/socket\.io/).*\.(js|mjs|css|json|map|webmanifest|png|jpe?g|gif|webp|avif|svg|ico|xml|txt|html|woff2?|ttf|otf|eot|wasm|mp4|webm|mp3|pdf)$ {
        try_files $uri =404;
    }

    # Vite 构建产物文件名带内容 hash，可一年长缓存；HTML 入口需每次校验以引用最新 hash
    # ^~：命中即跳过上面的扩展名正则，保住 expires 1y
    location ^~ /assets/ {
        expires 1y;
    }

    location = /index.html {
        expires epoch;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name admin.xysh88.com;
    resolver 127.0.0.11 ipv6=off;
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index admin.html;

    location /api {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源真 404（同主站：soft-404 防污染，排除代理路径）
    location ~* ^(?!/api|/socket\.io/).*\.(js|mjs|css|json|map|webmanifest|png|jpe?g|gif|webp|avif|svg|ico|xml|txt|html|woff2?|ttf|otf|eot|wasm|mp4|webm|mp3|pdf)$ {
        try_files $uri =404;
    }

    # ^~：跳过上面的扩展名正则，保住 expires 1y
    location ^~ /assets/ {
        expires 1y;
    }

    location = /admin.html {
        expires epoch;
    }

    location / {
        try_files $uri $uri/ /admin.html;
    }
}
