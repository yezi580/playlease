services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change_me_for_prod}
      MYSQL_DATABASE: ${DB_NAME:-game_rental}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      # 全站统一北京时间（配合 my.cnf 的 default-time-zone）
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-change_me_for_prod}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      # Node 侧同步北京时间，与 MySQL NOW() 保持同一时区
      TZ: Asia/Shanghai
      APP_NAME: ${APP_NAME:-my-app-prod}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-change_me_for_prod}
      DB_NAME: ${DB_NAME:-game_rental}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-30}
      DB_MAX_IDLE: ${DB_MAX_IDLE:-30}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-60000}
      DB_QUEUE_LIMIT: ${DB_QUEUE_LIMIT:-100}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-10000}
      DB_ENABLE_KEEP_ALIVE: ${DB_ENABLE_KEEP_ALIVE:-1}
      DB_KEEP_ALIVE_INITIAL_DELAY_MS: ${DB_KEEP_ALIVE_INITIAL_DELAY_MS:-0}
      JWT_SECRET: ${JWT_SECRET:-please_change_this_secret_in_production}
      JWT_EXPIRES_IN: 7d
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-cos}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RATE_LIMIT_REDIS_PREFIX: ${RATE_LIMIT_REDIS_PREFIX:-my-app:rate-limit:}
      PUBLIC_READ_LIMIT_MAX_PER_MIN: ${PUBLIC_READ_LIMIT_MAX_PER_MIN:-6000}
      AUTHENTICATED_READ_LIMIT_MAX_PER_MIN: ${AUTHENTICATED_READ_LIMIT_MAX_PER_MIN:-1800}
      AUTHENTICATED_WRITE_LIMIT_MAX_PER_MIN: ${AUTHENTICATED_WRITE_LIMIT_MAX_PER_MIN:-120}
      ORDER_WRITE_LIMIT_MAX_PER_MIN: ${ORDER_WRITE_LIMIT_MAX_PER_MIN:-60}
      CONVERSATION_API_LIMIT_MAX_PER_MIN: ${CONVERSATION_API_LIMIT_MAX_PER_MIN:-1800}
      AUTH_LIMIT_MAX_PER_5_MIN: ${AUTH_LIMIT_MAX_PER_5_MIN:-10}
      PUBLISH_LIMIT_MAX_PER_HOUR: ${PUBLISH_LIMIT_MAX_PER_HOUR:-5}
      SOCKET_MESSAGE_RATE_LIMIT_MAX: ${SOCKET_MESSAGE_RATE_LIMIT_MAX:-50}
      ADMIN_PASSKEY_ENABLED: ${ADMIN_PASSKEY_ENABLED:-true}
      SUPPORT_MONEY_STEP_UP_ENABLED: ${SUPPORT_MONEY_STEP_UP_ENABLED:-false}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-XYSH Admin}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-xysh88.com}
      PASSKEY_EXPECTED_ORIGINS: ${PASSKEY_EXPECTED_ORIGINS:-https://admin.xysh88.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://xysh88.com,https://www.xysh88.com,https://admin.xysh88.com}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock_payment}
      WITHDRAW_PROVIDER: ${WITHDRAW_PROVIDER:-mock_payment}
      MOCK_PAYMENT_AUTO_SUCCESS_SECONDS: ${MOCK_PAYMENT_AUTO_SUCCESS_SECONDS:-3}
      MOCK_PAYMENT_EXPIRES_MINUTES: ${MOCK_PAYMENT_EXPIRES_MINUTES:-15}
      MOCK_WITHDRAW_IMMEDIATE_SUCCESS: ${MOCK_WITHDRAW_IMMEDIATE_SUCCESS:-true}
      # AI 助手：Node 转发 ai-service 的内网地址与共享令牌
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_CHAT_LIMIT_MAX_PER_MIN: ${AI_CHAT_LIMIT_MAX_PER_MIN:-10}
    # 优雅停机：api 收到 SIGTERM 后先排干在途请求（应用内上限 15s，见 SHUTDOWN_DRAIN_TIMEOUT_MS），
    # 宽限期必须大于应用内排干上限，否则等来的是 SIGKILL，排干失去意义
    stop_grace_period: 30s
    # 存活检查仅探测进程可用（不查 DB，避免 MySQL 短暂重启时误判）；
    # 优雅停机期间 /api/health 返回 503，为后续蓝绿切换脚本提供就绪信号
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # 启动要跑 schema 引导任务后才 listen，宽限启动期不计数
      start_period: 60s
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== AI 助手微服务（Python FastAPI：RAG 规则问答 + 智能选号）=====
  # 不参与蓝绿：更新即 up -d --build ai-service（短暂中断可接受）
  ai-service:
    build: ./ai-service
    restart: always
    environment:
      TZ: Asia/Shanghai
      # LLM 密钥从根目录 .env 或 shell 环境读（.gitignore 已覆盖，git 里只有 ai-service/.env.example）
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-https://api.deepseek.com}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-deepseek-chat}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      # 工具调用查商品：compose 内主站服务名就是 api
      NODE_BASE_URL: http://api:3000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
