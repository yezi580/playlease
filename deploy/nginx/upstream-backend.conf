# 蓝绿上游（由 deploy/scripts/blue-green-deploy.sh 维护，勿手改）。
# 活跃色不带 down，闲置色带 down；「切流量 = 交换 down 标记 + nginx -s reload」。
# ⚠️ 切换脚本必须用 cat > 原地重写本文件（保 inode）：bind mount 下 rm+cp / sed -i
#    会换 inode，运行中的 nginx 容器看不到新内容（与 certs 目录同一陷阱）。
# ⚠️ 本文件是线上运行状态：remote-deploy-extract.sh 会备份恢复，
#    不要用部署包里的默认内容直接覆盖线上状态。
upstream api_backend {
    server api-blue:3000;
    server api-green:3000 down;
}
