# nginx 主配置（挂载为 /etc/nginx/nginx.conf，替代镜像默认配置）。
# 相比默认配置只多了一项关键设置：worker_shutdown_timeout ——
# 蓝绿切换 reload 后，旧 worker 会继续承载存量连接（含 websocket 长连接），
# 没有这个上限时长连接会把旧 worker 无限期留住，多次发布后 worker 越积越多；
# 超时后旧 worker 强制关闭存量连接，socket.io 客户端会自动重连到新色。
user  nginx;
worker_processes  auto;
worker_shutdown_timeout  30s;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    access_log  /var/log/nginx/access.log;

    # server 块（gzip / 限流 / 双域名 / upstream include）都在 conf.d 下
    include /etc/nginx/conf.d/*.conf;
}
