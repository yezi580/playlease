# ===== 传输压缩：JS/CSS/JSON/SVG 等文本资源 gzip 压缩（woff2/图片本身已压缩，无需处理） =====
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

# ===== CC 兜底限流：按 IP 限制 API 请求速率与并发（应用层限流之外的 nginx 层防线）=====
# 静态资源不限流，避免正常页面一次性加载几十个资源被误伤
limit_req_zone $binary_remote_addr zone=api_cc:10m rate=20r/s;
# 短信发送/登录等敏感入口用更严的独立速率
limit_req_zone $binary_remote_addr zone=sms_cc:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name xysh88.com www.xysh88.com admin.xysh88.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xysh88.com www.xysh88.com;
    resolver 127.0.0.11 ipv6=off;
    client_max_body_size 100m;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 静态前端安全头（API 响应由应用层 helmet 覆盖）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # ===== 后台入口堵漏：管理后台只能经 admin 子域名（受 IP 白名单保护）访问 =====
    location = /admin.html {
        return 404;
    }

    # 汇付异步支付回调：通知可能集中重试，且应用层已验签校验，不做 CC 限流
    location ~ ^/api/pay/callback/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 短信发送/短信登录：敏感入口，应用层已有配额，nginx 层再加一道更严兜底
    location ~ ^/api/auth/sms/ {
        limit_req zone=sms_cc burst=5 nodelay;
        limit_conn api_conn 10;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 客服工作台在主站内，其 Passkey 自助与二次校验端点必须保留在主域名可达
    # （(/|$) 兼容不带尾斜杠的列表端点 GET /api/admin/passkeys）
    location ~ ^/api/admin/(passkeys|step-up)(/|$) {
        limit_req zone=api_cc burst=40 nodelay;
        limit_conn api_conn 30;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/admin/ {
        return 404;
    }

    location /api/ {
        limit_req zone=api_cc burst=40 nodelay;
        limit_conn api_conn 30;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /socket.io/ {
        limit_req zone=api_cc burst=40 nodelay;
        limit_conn api_conn 30;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Vite 构建产物文件名带内容 hash，可一年长缓存；HTML 入口需每次校验以引用最新 hash
    location /assets/ {
        expires 1y;
    }

    location = /index.html {
        expires epoch;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.xysh88.com;
    resolver 127.0.0.11 ipv6=off;
    client_max_body_size 100m;

    ssl_certificate /etc/nginx/certs/admin.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/admin.privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 管理后台静态资源安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    include /etc/nginx/includes/admin-allowlist.conf;

    root /usr/share/nginx/html;
    index admin.html;

    location /api/ {
        limit_req zone=api_cc burst=40 nodelay;
        limit_conn api_conn 30;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /socket.io/ {
        limit_req zone=api_cc burst=40 nodelay;
        limit_conn api_conn 30;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /assets/ {
        expires 1y;
    }

    location = /admin.html {
        expires epoch;
    }

    location / {
        try_files $uri /admin.html;
    }
}
