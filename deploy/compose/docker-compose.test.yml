services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      - mysql_data_test:/var/lib/mysql
      - ../../server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    volumes:
      - redis_data_test:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../server
    restart: unless-stopped
    env_file:
      - ../env/test.env
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:${API_PORT}:3000"
    volumes:
      - ../../server/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT}:80"
      - "${PUBLIC_HTTPS_PORT}:443"
    volumes:
      - ../nginx/nginx.test.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_CERTS_DIR}:/etc/nginx/certs:ro
      - ${ADMIN_ALLOWLIST_FILE}:/etc/nginx/includes/admin-allowlist.conf:ro
      - ../../dist:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  mysql_data_test:
  redis_data_test:
