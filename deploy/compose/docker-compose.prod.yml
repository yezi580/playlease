services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # 容器日志轮转：json-file 默认无限增长，封顶防慢速膨胀（周期任务每分钟打日志）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # root 密码独立于应用密码：应用连接用 DB_USER/DB_PASSWORD（最小权限业务账号），
      # root 仅用于容器初始化与健康检查。未设置 DB_ROOT_PASSWORD 时向后兼容旧行为。
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      # 全站统一北京时间（配合 my.cnf 的 default-time-zone，NOW()/DATETIME 落库即北京时间）
      TZ: Asia/Shanghai
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ../../server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ../mysql/my.cnf:/etc/mysql/conf.d/zz-prod.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-${DB_PASSWORD}}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 容器日志轮转：json-file 默认无限增长，封顶防慢速膨胀（周期任务每分钟打日志）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== 蓝绿双 api 容器 =====
  # 活跃色承载流量（由 nginx 的 upstream-backend.conf 控制），闲置色常驻运行作为热备/回滚目标。
  # 两色共用镜像 tag my-app-api:current：只有 api-blue 带 build 段，构建一次即更新 tag，
  # 发布脚本只重建「闲置色」，重建动作永远不会碰正在接流量的活跃色。
  # ⚠️ 日常发布只用 deploy/scripts/blue-green-deploy.sh；不要手工对活跃色 up --force-recreate
  #    （那会重启正在接流量的容器，回到有停机窗口的旧模式）。
  # 优雅停机（两色同配）：SIGTERM 后排干在途请求（应用内上限 15s = SHUTDOWN_DRAIN_TIMEOUT_MS），
  # stop_grace_period 必须大于它；healthcheck 仅探测进程存活（不查 DB），
  # 停机期间 /api/health 返回 503，供蓝绿脚本判断就绪/摘流量。
  api-blue:
    build:
      context: ../../server
    image: my-app-api:current
    restart: unless-stopped
    # 容器日志轮转：json-file 默认无限增长，封顶防慢速膨胀（周期任务每分钟打日志）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ../env/prod.env
    environment:
      PORT: 3000
      # Node 侧同步北京时间：new Date()/序列化落库与 MySQL NOW() 保持同一时区
      TZ: Asia/Shanghai
    # 双色共挂网络别名 api：ai-service 用 http://api:3000 查商品即可无视蓝绿切换
    #（只读查询打哪一色都等价；某色重建的窗口期内 DNS 仍返回两 IP，工具层有一次重试兜底）
    networks:
      default:
        aliases:
          - api
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # 启动要跑 schema 引导任务后才 listen，宽限启动期不计数
      start_period: 60s
    # 双色各绑一个宿主机端口（本机调试/巡检用；nginx 走容器内网，不依赖这两个映射）
    ports:
      - "127.0.0.1:${API_BLUE_PORT:-3101}:3000"
    volumes:
      - ../../server/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-green:
    image: my-app-api:current
    restart: unless-stopped
    # 容器日志轮转：json-file 默认无限增长，封顶防慢速膨胀（周期任务每分钟打日志）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ../env/prod.env
    environment:
      PORT: 3000
      # Node 侧同步北京时间：new Date()/序列化落库与 MySQL NOW() 保持同一时区
      TZ: Asia/Shanghai
    # 双色共挂网络别名 api（用途见 api-blue 处注释）
    networks:
      default:
        aliases:
          - api
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "127.0.0.1:${API_GREEN_PORT:-3102}:3000"
    volumes:
      - ../../server/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== AI 助手微服务（Python FastAPI：RAG 规则问答 + 智能选号）=====
  # 单容器、不参与蓝绿（更新 = up -d --build ai-service，短暂中断可接受）；
  # 不暴露公网：浏览器 → nginx → Node(/api/ai/chat 统一限流鉴权) → 内网到本服务
  ai-service:
    build:
      context: ../../ai-service
    image: my-app-ai:current
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - ../env/prod.env
    environment:
      TZ: Asia/Shanghai
      # 工具调用查商品：经网络别名 api 直连蓝绿双容器（AI_SERVICE_URL 等其余配置在 prod.env）
      NODE_BASE_URL: http://api:3000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 本机调试用（nginx 走容器内网，不依赖此映射）
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-3103}:8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # 容器日志轮转：json-file 默认无限增长，封顶防慢速膨胀（周期任务每分钟打日志）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PUBLIC_HTTP_PORT}:80"
      - "${PUBLIC_HTTPS_PORT}:443"
    volumes:
      # 主配置带 worker_shutdown_timeout：切换 reload 后旧 worker 最多再活 30s，
      # 防止 websocket 长连接把旧 worker 无限期留住
      - ../nginx/nginx.main.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # 蓝绿上游（线上运行状态文件，由 blue-green-deploy.sh 原地重写切换，
      # ⚠️ 只能 cat > 原地写保 inode，rm+cp/sed -i 会让容器看不到新内容）
      - ../nginx/upstream-backend.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ${NGINX_CERTS_DIR}:/etc/nginx/certs:ro
      - ${ADMIN_ALLOWLIST_FILE}:/etc/nginx/includes/admin-allowlist.conf:ro
      - ../../dist:/usr/share/nginx/html:ro
    depends_on:
      - api-blue
      - api-green

volumes:
  mysql_data_prod:
  redis_data_prod:
