services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # root 密码独立于应用密码：应用连接用 DB_USER/DB_PASSWORD（最小权限业务账号），
      # root 仅用于容器初始化与健康检查。未设置 DB_ROOT_PASSWORD 时向后兼容旧行为。
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      # 全站统一北京时间（配合 my.cnf 的 default-time-zone，NOW()/DATETIME 落库即北京时间）
      TZ: Asia/Shanghai
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ../../server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ../mysql/my.cnf:/etc/mysql/conf.d/zz-prod.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-${DB_PASSWORD}}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../server
    restart: unless-stopped
    env_file:
      - ../env/prod.env
    environment:
      PORT: 3000
      # Node 侧同步北京时间：new Date()/序列化落库与 MySQL NOW() 保持同一时区
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${API_PORT}:3000"
    volumes:
      - ../../server/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT}:80"
      - "${PUBLIC_HTTPS_PORT}:443"
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_CERTS_DIR}:/etc/nginx/certs:ro
      - ${ADMIN_ALLOWLIST_FILE}:/etc/nginx/includes/admin-allowlist.conf:ro
      - ../../dist:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  mysql_data_prod:
  redis_data_prod:
